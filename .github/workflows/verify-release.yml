name: Verify Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Restore locked dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Verify release candidate
        run: npm run verify:release
      - name: Verify build leaves tracked source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-vsix
          path: artifacts/vsix/*.vsix
          if-no-files-found: error
          retention-days: 7
      - name: Export pinned API type tarball for offline recovery
        run: |
          $manifest = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $version = $manifest.devDependencies.'@types/vscode'
          New-Item -ItemType Directory -Path .release-cache -Force | Out-Null
          npm pack "@types/vscode@$version" --registry=https://registry.npmjs.org --pack-destination .release-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-api-types
          path: .release-cache/*.tgz
          if-no-files-found: error
          retention-days: 1
